services:
  postgres:
    image: postgres:17
    container_name: shipops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipops
      POSTGRES_USER: shipops
      POSTGRES_PASSWORD: shipops_dev_password
    ports:
      - "15432:5432"
    volumes:
      - shipops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipops -d shipops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: shipops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shipops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shipops_postgres_data:
  shipops_redis_data: